# Netlify evaluates these paths from the monorepo root, even though this file
# lives in apps/platform. Keep every build artifact path root-relative.
[build]
  command = "pnpm install --frozen-lockfile=false && pnpm --filter platform run build:jhn"
  publish = "apps/platform/dist"
  functions = "apps/platform/netlify/profiles/jhn/functions"
  edge_functions = "apps/platform/netlify/profiles/jhn/edge-functions"

[build.environment]
  NODE_OPTIONS = "--max-old-space-size=4096"
  NODE_VERSION = "24"
  PNPM_VERSION = "10.28.2"

[dev]
  command = "node scripts/check-tunnel.js && pnpm --filter platform exec vite"
  port = 8888
  targetPort = 5173
  publish = "apps/platform/dist"
  functions = "apps/platform/netlify/functions"

[functions]
  node_bundler = "esbuild"

[[edge_functions]]
  function = "gen-ophelia-chat-stream"
  path = "/api/chat-stream"

[[edge_functions]]
  function = "nasa-control"
  path = "/api/nasa/control"

[[edge_functions]]
  function = "jhn-cop-events"
  path = "/api/jhn-cop-events"

[[edge_functions]]
  function = "github-webhook"
  path = "/api/webhooks/github"

[[edge_functions]]
  function = "gen-oleole-presence-api"
  path = "/api/oleole/*"

# SPA fallback — must remain last so /api/* rules win first
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
