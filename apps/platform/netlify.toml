# Build context: Netlify site package_path = apps/platform (cwd = this folder).
# Climb to monorepo root for pnpm workspace install + filter build.
[build]
  command = "cd ../.. && pnpm install --frozen-lockfile=false && pnpm --filter platform run build:jhn"
  publish = "dist"
  functions = "netlify/profiles/jhn/functions"
  edge_functions = "netlify/profiles/jhn/edge-functions"

[build.environment]
  NODE_OPTIONS = "--max-old-space-size=4096"
  NODE_VERSION = "24"
  PNPM_VERSION = "10.28.2"

[dev]
  command = "node ../../scripts/check-tunnel.js && pnpm vite"
  port = 8888
  targetPort = 5173
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[edge_functions]]
  function = "gen-ophelia-chat-stream"
  path = "/api/chat-stream"

[[edge_functions]]
  function = "nasa-control"
  path = "/api/nasa/control"

[[edge_functions]]
  function = "jhn-cop-events"
  path = "/api/jhn-cop-events"
# SPA fallback — must remain last so /api/* rules win first
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
